name: HFS native special names
on:
  workflow_call:
  workflow_dispatch:
concurrency:
  group: hfs-special-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local
jobs:
  native:
    name: HFS native special names (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest, xcode-27]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up shared CI reporting
        uses: ./.github/actions/setup-ci-runner
      - name: Verify native evidence rejection tests
        run: |
          apfs-ci-runner --suite hfs-special-names/native/step3 --timeout 19m -- go test -json scripts/capture-hfs-special-names.go scripts/capture-hfs-special-names_test.go
      - name: Capture mounted HFS special names and raw catalog bytes
        run: |
          apfs-ci-runner --suite hfs-special-names/native/step4 --timeout 19m -- go run scripts/capture-hfs-special-names.go -out artifacts/hfs-special-names
      - name: Require every retained profile and replay fresh native evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/hfs-special-names
          export APFS_HFS_SPECIAL_CAPTURE="$GITHUB_WORKSPACE/artifacts/hfs-special-names/native.json.gz"
          apfs-ci-runner --suite hfs-special-names/native/step5 --timeout 19m -- go test -count=1 -json ./pkg/hfsplus -run '^TestHFSSpecialNativeEvidence$' > artifacts/hfs-special-names/replay.jsonl
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          include-hidden-files: true
          name: hfs-special-names-${{ matrix.os }}
          path: artifacts/hfs-special-names/
          compression-level: 9
          if-no-files-found: error

      - name: Retain complete CI command diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: ci-observability-hfs-special-names-native-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: artifacts/ci-observability/
          compression-level: 9
          if-no-files-found: error
