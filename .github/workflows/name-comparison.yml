name: Filename comparison and image readers
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: Run supplemental per-image macOS 15 diagnostics; cannot qualify the full gate
        type: boolean
        default: false
      command_boundaries:
        description: Supplemental single-image host, attach, readback and detach checkpoints
        type: boolean
        default: false
      diagnostic_case:
        description: Exact retained case ID for supplemental boundary diagnostics; empty means all cases
        type: string
        default: ""
      diagnostic_profile:
        type: string
        default: "26"
      diagnostic_filesystem:
        type: string
        default: APFS
      producer_run:
        description: Completed genuine image producer run for supplemental diagnostics
        type: string
        default: "37433253504"
concurrency:
  group: name-comparison-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}${{ inputs.command_boundaries && format('-boundary-{0}-{1}-{2}', inputs.diagnostic_profile, inputs.diagnostic_filesystem, inputs.diagnostic_case || 'all') || (inputs.diagnostic_only && '-diagnostic' || '') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local
jobs:
  supplemental-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic_only && !inputs.command_boundaries
    uses: ./.github/workflows/name-image-diagnostic.yml
    with:
      producer_run: ${{ inputs.producer_run }}
  boundary-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic_only && inputs.command_boundaries
    uses: ./.github/workflows/name-image-boundary-diagnostic.yml
    with:
      producer_run: ${{ inputs.producer_run }}
      profile: ${{ inputs.diagnostic_profile }}
      filesystem: ${{ inputs.diagnostic_filesystem }}
      case_id: ${{ inputs.diagnostic_case }}
  native-images:
    if: inputs.diagnostic_only != true
    name: Comparison images (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest, xcode-27]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Capture all native names and validate exact retained profile
        run: go run scripts/capture-name-collation.go -out artifacts/name-collation -check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: name-collation-${{ matrix.os }}
          path: artifacts/name-collation/
          compression-level: 9
          if-no-files-found: error
  readers:
    name: Name image readers (${{ matrix.os }})
    needs: native-images
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-latest, xcode-27]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          pattern: name-collation-*
          path: artifacts/native-images
      - name: Verify reproducible native-qualified tables
        run: |
          go run scripts/generate-name-tables.go -check
          go run scripts/generate-name-admission.go -check
          go test scripts/generate-name-admission.go scripts/generate-name-admission_test.go
      - name: Verify strict harness rejection tests
        run: go test scripts/verify-name-comparison.go scripts/verify-name-comparison_gate_test.go
      - name: Verify all native image lookups and production coverage
        shell: bash
        run: |
          export APFS_NAME_IMAGE_ARTIFACTS="$GITHUB_WORKSPACE/artifacts/native-images"
          go run scripts/verify-name-comparison.go
      - name: Verify bounded native command diagnostics
        run: go test -count=1 -run '^TestNativeReadback(Command|Mount)' scripts/verify-name-native_commands_test.go scripts/verify-name-native_commands_fault_test.go
      - name: Verify matrix rejects missing or invalid qualification
        run: go test -count=1 -run '^TestNativeNameMatrix' scripts/capture-name-collation.go scripts/verify-name-comparison_test.go scripts/verify-name-native_readback_test.go scripts/verify-name-native_commands_test.go scripts/verify-name-native_matrix_test.go
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: name-comparison-${{ matrix.os }}
          path: artifacts/name-comparison-coverage/
          compression-level: 9
          if-no-files-found: error
  native-readers:
    name: Native names (producer ${{ matrix.producer }}, receiver ${{ matrix.receiver.version }}, ${{ matrix.filesystem }})
    needs: native-images
    runs-on: ${{ matrix.receiver.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        producer: [15, 26, 27]
        receiver:
          - {version: 15, os: macos-15}
          - {version: 26, os: macos-latest}
          - {version: 27, os: xcode-27}
        filesystem: [APFS, APFSX, HFS+, HFSX]
    env:
      APFS_NAME_PRODUCER: ${{ matrix.producer }}
      APFS_NAME_RECEIVER: ${{ matrix.receiver.version }}
      APFS_NAME_FILESYSTEM: ${{ matrix.filesystem }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          pattern: name-collation-*
          path: artifacts/native-images
      - name: Build native image readback harness
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/name-native-build
          go test -c -o "$GITHUB_WORKSPACE/artifacts/name-native-build/native-readback.test" scripts/capture-name-collation.go scripts/verify-name-comparison_test.go scripts/verify-name-native_readback_test.go scripts/verify-name-native_commands_test.go 2>&1 | tee artifacts/name-native-build/build.log
      - name: Preserve native harness build diagnostics before execution
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: name-native-build-${{ matrix.producer }}-${{ matrix.receiver.version }}-${{ matrix.filesystem }}
          path: artifacts/name-native-build/
          compression-level: 9
          if-no-files-found: error
      - name: Read every case in this producer image on the actual receiver
        timeout-minutes: 32
        shell: bash
        run: |
          set -euo pipefail
          export APFS_NAME_IMAGE_ARTIFACTS="$GITHUB_WORKSPACE/artifacts/native-images"
          cd scripts
          go tool test2json -t -p command-line-arguments "$GITHUB_WORKSPACE/artifacts/name-native-build/native-readback.test" -test.v=test2json -test.count=1 -test.timeout=30m -test.run='^TestNativeCrossVersionNameImages$' | tee "$GITHUB_WORKSPACE/artifacts/name-native-readback-tests.jsonl"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: name-native-cell-${{ matrix.producer }}-${{ matrix.receiver.version }}-${{ matrix.filesystem }}
          path: |
            artifacts/name-native-readback/
            artifacts/name-native-readback-tests.jsonl
          compression-level: 9
          if-no-files-found: error
  qualify-matrix:
    name: Qualify complete producer and receiver matrix
    if: always() && inputs.diagnostic_only != true
    needs: [native-images, readers, native-readers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require all producer and reader jobs to succeed
        env:
          PRODUCERS: ${{ needs.native-images.result }}
          PORTABLE_READERS: ${{ needs.readers.result }}
          NATIVE_READERS: ${{ needs.native-readers.result }}
        run: |
          test "$PRODUCERS" = success
          test "$PORTABLE_READERS" = success
          test "$NATIVE_READERS" = success
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          pattern: name-native-cell-*
          path: artifacts/name-native-matrix
      - uses: actions/download-artifact@v8
        with:
          pattern: name-collation-*
          path: artifacts/native-images
      - name: Require all 36 complete same-revision cells and raw evidence
        env:
          APFS_NAME_IMAGE_ARTIFACTS: ${{ github.workspace }}/artifacts/native-images
          APFS_NAME_MATRIX_ARTIFACTS: ${{ github.workspace }}/artifacts/name-native-matrix
        run: |
          cd scripts
          go test -count=1 -run '^TestQualifyNativeNameMatrix$' capture-name-collation.go verify-name-comparison_test.go verify-name-native_readback_test.go verify-name-native_commands_test.go verify-name-native_matrix_test.go
