name: Native existing-name lookup

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: name-lookup-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local

jobs:
  native:
    name: Native name lookup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest, xcode-27]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up shared CI reporting
        uses: ./.github/actions/setup-ci-runner
      - name: Capture every mounted and ordinary native limit control
        run: |
          apfs-ci-runner --suite name-lookup/native/step3 --timeout 29m -- go run scripts/capture-name-lookup.go -out artifacts/name-lookup
      - name: Replay the complete fresh native capture through the production resolver
        env:
          APFS_NAME_LOOKUP_CAPTURE: ${{ github.workspace }}/artifacts/name-lookup/capture.json.gz
        run: |
          apfs-ci-runner --suite name-lookup/native/step4 --timeout 29m -- go test -json -tags native_name_lookup_fresh ./pkg/recompression -run '^TestFreshNativeNameLookup$' -count=1 -v
      - name: Retain native outputs, complete ASTs, source bytes and mount cleanup evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: name-lookup-${{ matrix.os }}
          path: artifacts/name-lookup/
          if-no-files-found: error
      - name: Require all three retained native release profiles
        run: |
          apfs-ci-runner --suite name-lookup/native/step6 --timeout 29m -- go test -json ./pkg/recompression -run '^TestNativeNameLookup$' -count=1 -v

      - name: Retain complete CI command diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: ci-observability-name-lookup-native-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: artifacts/ci-observability/
          compression-level: 9
          if-no-files-found: error
  portable:
    name: Replay name lookup (${{ matrix.os }})
    needs: native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up shared CI reporting
        uses: ./.github/actions/setup-ci-runner
      - name: Replay all three mandatory retained native release profiles
        run: |
          apfs-ci-runner --suite name-lookup/portable/step3 --timeout 19m -- go test -json ./pkg/recompression -run '^TestNativeNameLookup$' -count=1 -v

      - name: Retain complete CI command diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: ci-observability-name-lookup-portable-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: artifacts/ci-observability/
          compression-level: 9
          if-no-files-found: error
