# Producer-only evidence collection. These jobs do not replace any acceptance,
# source-provenance, coverage, no-skip or native readback qualification gate.
# Promote genuine archives only after review; historical fixtures are never edited.
name: Capture native harness evidence

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Base captures first; dependent captures after reviewed prerequisite promotion
        type: choice
        options: [base, dependent]
        default: base
        required: true
      recipe:
        description: Optional exact capture recipe; empty collects the complete phase
        type: string
        default: ""
  workflow_call:
    inputs:
      phase:
        description: base or dependent
        type: string
        required: true
      recipe:
        description: Optional exact capture recipe
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: native-harness-recapture-${{ github.ref }}-${{ inputs.phase }}-${{ inputs.recipe || 'all' }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"

jobs:
  validate-phase:
    name: Validate capture-only phase
    runs-on: ubuntu-latest
    steps:
      - name: Require an explicit supported phase
        shell: bash
        env:
          CAPTURE_PHASE: ${{ inputs.phase }}
          CAPTURE_RECIPE: ${{ inputs.recipe }}
        run: |
          set -euo pipefail
          case "$CAPTURE_PHASE" in
            base|dependent) ;;
            *) echo 'Expected base or dependent capture phase' >&2; exit 1 ;;
          esac
          case "$CAPTURE_PHASE:$CAPTURE_RECIPE" in
            base:|dependent:) ;;
            base:compression-blocks-27) ;;
            base:compression-lifecycle-27) ;;
            base:compression-lz4-26) ;;
            base:compression-lz4-27) ;;
            base:compression-operation-15) ;;
            base:compression-operation-26) ;;
            base:compression-operation-27) ;;
            base:compression-owned-15) ;;
            base:compression-owned-26) ;;
            base:compression-owned-27) ;;
            base:compression-policy-27) ;;
            base:compression-query-26) ;;
            base:compression-query-27) ;;
            dependent:compression-state-27) ;;
            base:compression-writer-27) ;;
            dependent:compression-zlib-source-27) ;;
            base:content-open-27) ;;
            base:entry-type-27) ;;
            dependent:hfs-finderinfo-27) ;;
            base:hfs-special-names-15) ;;
            base:hfs-special-names-26) ;;
            base:hfs-special-names-27) ;;
            base:large-compression-27) ;;
            base:name-admission-15) ;;
            base:name-admission-26) ;;
            base:name-admission-27) ;;
            base:name-collation-15) ;;
            base:name-collation-26) ;;
            base:name-collation-27) ;;
            base:name-lookup-15) ;;
            base:name-lookup-26) ;;
            base:name-lookup-27) ;;
            base:pathname-limits-15) ;;
            base:pathname-limits-26) ;;
            base:pathname-limits-27) ;;
            dependent:recompression-access-15) ;;
            dependent:recompression-access-26) ;;
            dependent:recompression-access-27) ;;
            base:replacement-27) ;;
            base:resource-fork-open-15) ;;
            base:resource-fork-open-26) ;;
            base:resource-fork-open-27) ;;
            *) echo 'Recipe does not belong to the requested capture phase' >&2; exit 1 ;;
          esac

  compression-blocks-27:
    name: Capture only - compression-blocks-27
    needs: validate-phase
    if: inputs.phase == 'base' && (inputs.recipe == '' || inputs.recipe == 'compression-blocks-27')
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up shared CI reporting
        uses: ./.github/actions/setup-ci-runner
      - name: Bind native profile and untouched source revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/native-recapture
          /usr/bin/sw_vers > artifacts/native-recapture/host.txt
          version=$(/usr/bin/sw_vers -productVersion)
          major="${version%%.*}"
          if [ "$major" != '27' ]; then
            echo 'Wrong actual macOS profile for this capture' >&2
            exit 1
          fi
          git diff --exit-code
          git diff --cached --exit-code
          git rev-parse HEAD > artifacts/native-recapture/revision.txt
          printf '%s\n' 'compression-blocks-27' > artifacts/native-recapture/recipe.txt
      - name: Generate complete genuine native evidence
        shell: bash
        run: |
          set -euo pipefail
          apfs-ci-runner --suite native-recapture/compression-blocks-27 --timeout 55m -- go run scripts/capture-compression-blocks.go -out artifacts/compression-blocks/native.json.gz
      - name: Confirm authoritative sources and fixtures remain unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
      - name: Verify capture artifacts contain no live mounts
        id: capture-unmounted
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/native-recapture
          apfs-ci-runner --suite native-recapture/mount-table --timeout 1m -- /sbin/mount > artifacts/native-recapture/mounts.txt
          physical_root=$(pwd -P)
          while IFS= read -r line; do
            case "$line" in
              *" on $physical_root/artifacts/"*|*" on $PWD/artifacts/"*)
                printf 'Refusing recursive upload of a live mount: %s\n' "$line" >&2
                exit 1
                ;;
            esac
          done < artifacts/native-recapture/mounts.txt
      - name: Retain complete unmounted capture
        if: always() && steps.capture-unmounted.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: native-harness-recapture-compression-blocks-27-${{ github.run_attempt }}
          path: |
            artifacts/compression-blocks/
          compression-level: 9
          if-no-files-found: error
      - name: Retain command diagnostics even when capture cleanup fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: native-harness-recapture-compression-blocks-27-diagnostics-${{ github.run_attempt }}
          path: |
            artifacts/native-recapture/
            artifacts/ci-observability/
          compression-level: 9
          if-no-files-found: error

