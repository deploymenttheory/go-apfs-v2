name: Held replacement qualification

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: replacement-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local

jobs:
  qualification:
    name: Replacement coverage and native controls (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, windows-2025, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up shared CI reporting
        uses: ./.github/actions/setup-ci-runner
      - name: Require EFS service for native encrypted-file controls
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Service -Name EFS -StartupType Manual
          Start-Service -Name EFS
          Get-Service -Name EFS | Format-List Name,Status,StartType
          fsutil behavior query disableencryption
          if ($LASTEXITCODE -ne 0) { throw 'Cannot query required EFS capability' }
      - name: Require complete hostdata and every changed replacement file above 95 percent
        run: |
          apfs-ci-runner --suite replacement/qualification/step4 --timeout 39m -- go run scripts/verify-replacement.go
      - name: Retain exact tests and per-file coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: replacement-qualification-${{ matrix.os }}
          path: artifacts/replacement-coverage/
          if-no-files-found: error

      - name: Retain complete CI command diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: ci-observability-replacement-qualification-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: artifacts/ci-observability/
          compression-level: 9
          if-no-files-found: error

  native-volumes:
    name: Replacement volume capabilities (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest, xcode-27]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up shared CI reporting
        uses: ./.github/actions/setup-ci-runner
      - name: Qualify native APFS, HFS+, FAT32 and exFAT replacement
        run: apfs-ci-runner --suite replacement/volume-capabilities --timeout 12m -- go run scripts/verify-replacement-volume.go
      - name: Capture complete native replacement metadata matrix
        run: apfs-ci-runner --suite replacement/filesystem-capture --timeout 3m -- go run scripts/verify-replacement-filesystem.go
      - name: Retain native replacement metadata evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: replacement-filesystem-${{ matrix.os }}
          path: artifacts/replacement-filesystem/
          if-no-files-found: error
          compression-level: 9
      - name: Retain native observations, ASTs and complete command diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: replacement-volume-${{ matrix.os }}
          path: |
            artifacts/replacement-volume/
            artifacts/ci-observability/
          if-no-files-found: error
          compression-level: 9

  filesystem-replay:
    name: Replay all native replacement metadata (${{ matrix.os }})
    needs: native-volumes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up shared CI reporting
        uses: ./.github/actions/setup-ci-runner
      - uses: actions/download-artifact@v8
        with:
          pattern: replacement-filesystem-*
          path: artifacts/native-replacement/
      - name: Verify source bindings and replay every producer
        shell: bash
        run: |
          set -euo pipefail
          for producer in macos-15 macos-latest xcode-27; do
            apfs-ci-runner --suite "replacement/filesystem-replay/$producer" --timeout 2m -- go run scripts/verify-replacement-filesystem.go -replay -dir "artifacts/native-replacement/replacement-filesystem-$producer"
          done
      - name: Retain replay results and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: replacement-filesystem-replay-${{ matrix.os }}
          path: |
            artifacts/native-replacement/
            artifacts/ci-observability/
          if-no-files-found: error
          compression-level: 9
