name: Native compression profiles

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      capture_phase:
        description: Supplemental genuine fixture regeneration only; full runs the complete qualification
        type: choice
        options: [full, base, dependent]
        default: full
      capture_recipe:
        description: Optional exact recipe for supplemental recapture only
        type: string
        default: ""

concurrency:
  group: compression-native-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.capture_recipe || 'all' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local

jobs:
  recapture:
    if: github.event_name == 'workflow_dispatch' && inputs.capture_phase != '' && inputs.capture_phase != 'full'
    uses: ./.github/workflows/native-harness-recapture.yml
    with:
      phase: ${{ inputs.capture_phase }}
      recipe: ${{ inputs.capture_recipe }}
  native:
    if: inputs.capture_phase == '' || inputs.capture_phase == 'full'
    name: Native compression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, xcode-27]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up shared CI reporting
        uses: ./.github/actions/setup-ci-runner
      - name: Recapture complete native LZ4 and kernel storage inventory
        run: |
          apfs-ci-runner --suite compression-native/native/step3 --timeout 44m -- go run scripts/capture-compression-lz4.go -check
      - name: Recapture guarded native compression queries
        if: ${{ !cancelled() }}
        run: |
          apfs-ci-runner --suite compression-native/native/step4 --timeout 44m -- go test -json scripts/capture-compression-query.go scripts/capture-compression-query_test.go
          apfs-ci-runner --suite compression-native/native/step4 --timeout 44m -- go run scripts/capture-compression-query.go -check
      - name: Recapture compression installation and partial failures
        if: ${{ !cancelled() }}
        run: |
          apfs-ci-runner --suite compression-native/native/step5 --timeout 44m -- go test -json scripts/capture-compression-lifecycle.go scripts/capture-compression-lifecycle_test.go
          apfs-ci-runner --suite compression-native/native/step5 --timeout 44m -- go run scripts/capture-compression-lifecycle.go -check
      - name: Recapture native acquisition, read failures and surviving states
        if: ${{ !cancelled() }}
        run: |
          apfs-ci-runner --suite compression-native/native/step6 --timeout 44m -- go run scripts/capture-compression-operation.go -check
          apfs-ci-runner --suite compression-native/native/step6 --timeout 44m -- go test -json scripts/capture-compression-operation.go scripts/capture-compression-operation_test.go
      - name: Qualify complete quarantine contexts and destination outcomes
        if: ${{ !cancelled() }}
        run: |
          apfs-ci-runner --suite compression-native/native/step7 --timeout 44m -- go run scripts/verify-appledouble-quarantine-runtime.go -contexts
          apfs-ci-runner --suite compression-native/native/step7 --timeout 44m -- go run scripts/verify-appledouble-quarantine-runtime.go -existing
          apfs-ci-runner --suite compression-native/native/step7 --timeout 44m -- go run scripts/verify-appledouble-quarantine-runtime.go -destinations
      - name: Qualify every effective quarantine process flag independently
        if: ${{ !cancelled() }}
        run: |
          apfs-ci-runner --suite compression-native/native/step8 --timeout 44m -- go run scripts/verify-appledouble-quarantine-runtime.go -raw-processes
      - name: Recapture resource-fork opening and inode association
        if: ${{ !cancelled() }}
        run: |
          apfs-ci-runner --suite compression-native/native/step9 --timeout 44m -- go run scripts/capture-resource-fork-open.go -check
      - name: Verify held Go installation on host, APFS and HFS+
        if: ${{ !cancelled() }}
        run: |
          apfs-ci-runner --suite compression-native/native/step10 --timeout 44m -- go run scripts/verify-compression-installation-native.go
      - name: Replay compression lifecycle and complete hostdata coverage
        if: ${{ !cancelled() }}
        run: |
          apfs-ci-runner --suite compression-native/native/step11 --timeout 44m -- go run scripts/verify-compression-lifecycle.go
      - name: Replay complete portable compression corpus above 95 percent coverage
        if: ${{ !cancelled() }}
        run: |
          apfs-ci-runner --suite compression-native/native/step12 --timeout 44m -- go run scripts/verify-decmpfs-formats-coverage.go
      - name: Upload fresh native profiles and replay evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: compression-native-${{ matrix.os }}
          path: |
            artifacts/compression-lz4/
            artifacts/compression-query/
            artifacts/compression-operation/
            artifacts/resource-fork-open/
            artifacts/compression-lifecycle/
            artifacts/compression-lifecycle-coverage/
            artifacts/compression-installation-native/
            artifacts/appledouble-quarantine-runtime-raw-processes/
            artifacts/appledouble-quarantine-runtime-contexts/
            artifacts/appledouble-quarantine-runtime-existing/
            artifacts/appledouble-quarantine-runtime-destinations/
            artifacts/decmpfs-formats-coverage/
          if-no-files-found: error

      - name: Retain complete CI command diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: ci-observability-compression-native-native-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: artifacts/ci-observability/
          compression-level: 9
          if-no-files-found: error
  macos15:
    if: inputs.capture_phase == '' || inputs.capture_phase == 'full'
    name: Native compression compatibility (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up shared CI reporting
        uses: ./.github/actions/setup-ci-runner
      - name: Qualify native version detection and explicit targets above 95%
        run: |
          apfs-ci-runner --suite compression-native/macos15/step3 --timeout 44m -- go run scripts/verify-osversion.go
      - name: Recapture complete acquisition, read failures and surviving states
        if: ${{ !cancelled() }}
        run: |
          apfs-ci-runner --suite compression-native/macos15/step4 --timeout 44m -- go run scripts/capture-compression-operation.go -check
          apfs-ci-runner --suite compression-native/macos15/step4 --timeout 44m -- go test -json scripts/capture-compression-operation.go scripts/capture-compression-operation_test.go
      - name: Recapture resource-fork opening and inode association
        if: ${{ !cancelled() }}
        run: |
          apfs-ci-runner --suite compression-native/macos15/step5 --timeout 44m -- go run scripts/capture-resource-fork-open.go -check
      - name: Verify held Go installation on host, APFS and HFS+
        if: ${{ !cancelled() }}
        run: |
          apfs-ci-runner --suite compression-native/macos15/step6 --timeout 44m -- go run scripts/verify-compression-installation-native.go
      - name: Retain macOS 15 version and compression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: compression-native-macos-15
          path: |
            artifacts/osversion-coverage/
            artifacts/compression-operation/
            artifacts/resource-fork-open/
            artifacts/compression-installation-native/
          if-no-files-found: error

      - name: Retain complete CI command diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: ci-observability-compression-native-macos15-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: artifacts/ci-observability/
          compression-level: 9
          if-no-files-found: error
