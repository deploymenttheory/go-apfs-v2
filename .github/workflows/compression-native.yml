name: Native compression profiles

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: compression-native-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local

jobs:
  native:
    name: Native compression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, xcode-27]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Recapture complete native LZ4 and kernel storage inventory
        run: go run scripts/capture-compression-lz4.go -check
      - name: Recapture guarded native compression queries
        if: ${{ !cancelled() }}
        run: go run scripts/capture-compression-query.go -check
      - name: Recapture compression installation and partial failures
        if: ${{ !cancelled() }}
        run: go run scripts/capture-compression-lifecycle.go -check
      - name: Recapture native acquisition, read failures and surviving states
        if: ${{ !cancelled() }}
        run: |
          go test scripts/capture-compression-operation.go scripts/capture-compression-operation_test.go
          go run scripts/capture-compression-operation.go -check
      - name: Qualify complete quarantine contexts and destination outcomes
        if: ${{ !cancelled() }}
        run: |
          go run scripts/verify-appledouble-quarantine-runtime.go -contexts
          go run scripts/verify-appledouble-quarantine-runtime.go -existing
          go run scripts/verify-appledouble-quarantine-runtime.go -destinations
      - name: Qualify every effective quarantine process flag independently
        if: ${{ !cancelled() }}
        run: go run scripts/verify-appledouble-quarantine-runtime.go -raw-processes
      - name: Verify held Go installation on host, APFS and HFS+
        if: ${{ !cancelled() }}
        run: go run scripts/verify-compression-installation-native.go
      - name: Replay compression lifecycle and complete hostdata coverage
        if: ${{ !cancelled() }}
        run: go run scripts/verify-compression-lifecycle.go
      - name: Replay complete portable compression corpus above 95 percent coverage
        if: ${{ !cancelled() }}
        run: go run scripts/verify-decmpfs-formats-coverage.go
      - name: Upload fresh native profiles and replay evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compression-native-${{ matrix.os }}
          path: |
            artifacts/compression-lz4/
            artifacts/compression-query/
            artifacts/compression-operation/
            artifacts/compression-lifecycle/
            artifacts/compression-lifecycle-coverage/
            artifacts/compression-installation-native/
            artifacts/appledouble-quarantine-runtime-raw-processes/
            artifacts/appledouble-quarantine-runtime-contexts/
            artifacts/appledouble-quarantine-runtime-existing/
            artifacts/appledouble-quarantine-runtime-destinations/
            artifacts/decmpfs-formats-coverage/
          if-no-files-found: error
