name: Supplemental macOS 15 image diagnostics
on:
  workflow_call:
    inputs:
      producer_run:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      producer_run:
        description: Completed workflow run containing all three genuine name-collation producers
        type: string
        required: true
        default: "37433253504"
permissions:
  contents: read
  actions: read
concurrency:
  group: name-image-diagnostic-${{ github.ref }}
  cancel-in-progress: false
env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local
jobs:
  diagnostic:
    name: Diagnostic only (${{ matrix.profile }}, ${{ matrix.filesystem }})
    runs-on: macos-15
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        profile: [15, 26, 27]
        filesystem: [APFS, APFSX, HFS+, HFSX]
    env:
      APFS_NAME_DIAGNOSTIC_PROFILE: ${{ matrix.profile }}
      APFS_NAME_DIAGNOSTIC_FILESYSTEM: ${{ matrix.filesystem }}
      APFS_NAME_DIAGNOSTIC_RUN: ${{ inputs.producer_run }}
      APFS_NAME_DIAGNOSTIC_HOST: "15"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up shared CI reporting
        uses: ./.github/actions/setup-ci-runner
      - name: Record completed producer run identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$APFS_NAME_DIAGNOSTIC_RUN" =~ ^[0-9]+$ ]]
          mkdir -p artifacts/name-native-diagnostic
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APFS_NAME_DIAGNOSTIC_RUN" > artifacts/name-native-diagnostic/source-run.json
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.producer_run }}
          pattern: name-collation-*
          path: artifacts/native-images
      - name: Build and validate exact image checkpoint before native attachment
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          export APFS_NAME_IMAGE_ARTIFACTS="$GITHUB_WORKSPACE/artifacts/native-images"
          export APFS_NAME_DIAGNOSTIC_RUN_MANIFEST="$GITHUB_WORKSPACE/artifacts/name-native-diagnostic/source-run.json"
          apfs-ci-runner --suite name-image-diagnostic/diagnostic/step5 --timeout 5m -- go test -c -o "$GITHUB_WORKSPACE/artifacts/name-native-diagnostic/diagnostic.test" scripts/capture-name-collation.go scripts/verify-name-comparison_test.go scripts/verify-name-native_readback_test.go scripts/verify-name-native_commands_test.go scripts/verify-name-native_diagnostic_test.go 2>&1 | tee artifacts/name-native-diagnostic/build.log
          cd scripts
          apfs-ci-runner --suite name-image-diagnostic/diagnostic/step5 --timeout 5m -- go tool test2json -t -p command-line-arguments "$GITHUB_WORKSPACE/artifacts/name-native-diagnostic/diagnostic.test" -test.v=test2json -test.timeout=3m -test.run='^(TestSingleNameDiagnostic.*|TestPrepareNativeSingleNameImageDiagnostic)$' | tee "$GITHUB_WORKSPACE/artifacts/name-native-diagnostic/prepare-tests.jsonl"
      - name: Upload durable checkpoint before native image execution
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: diagnostic-checkpoint-${{ matrix.profile }}-${{ matrix.filesystem }}
          path: artifacts/name-native-diagnostic/
          compression-level: 9
          if-no-files-found: error
      - name: Diagnose all 7506 observations for this one image
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          export APFS_NAME_IMAGE_ARTIFACTS="$GITHUB_WORKSPACE/artifacts/native-images"
          export APFS_NAME_DIAGNOSTIC_RUN_MANIFEST="$GITHUB_WORKSPACE/artifacts/name-native-diagnostic/source-run.json"
          cd scripts
          apfs-ci-runner --suite name-image-diagnostic/diagnostic/step7 --timeout 3m -- go tool test2json -t -p command-line-arguments "$GITHUB_WORKSPACE/artifacts/name-native-diagnostic/diagnostic.test" -test.v=test2json -test.timeout=3m -test.run='^TestNativeSingleNameImageDiagnostic$' | tee "$GITHUB_WORKSPACE/artifacts/name-native-diagnostic/native-tests.jsonl"
      - name: Preserve supplemental outcome and raw native command logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: diagnostic-outcome-${{ matrix.profile }}-${{ matrix.filesystem }}
          path: artifacts/name-native-diagnostic/
          compression-level: 9
          if-no-files-found: error

      - name: Retain complete CI command diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: ci-observability-name-image-diagnostic-diagnostic-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: artifacts/ci-observability/
          compression-level: 9
          if-no-files-found: error
