        shell: bash
        run: |
          mkdir -p artifacts/vendor-dmg
          go test -json -count=1 -run TestAcceptance ./acceptance/ | tee artifacts/vendor-dmg/bbedit.jsonl
      - name: Upload commercial DMG acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
