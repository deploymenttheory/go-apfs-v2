name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build (MIT)
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  lint:
    name: Lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Platform-specific files (mount, host metadata) only lint under their
        # own GOOS.
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0
        env:
          GOOS: ${{ matrix.goos }}
        with:
          version: v2.14.0

      # Use the Go version selected above, not the version that built the linter.
      - name: Check gofmt
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1.1.0
        with:
          # The default "stable" overrides go-version-file.
          go-version-input: ""
          go-version-file: go.mod

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # -race needs cgo, which the other test jobs turn off. -short skips the
      # scale tests (tens of thousands of files, gigabyte images): they
      # exercise single-threaded code, and under the race detector's memory
      # overhead they exceed the runner.
      - name: Unit tests with -race
        env:
          CGO_ENABLED: "1"
        run: go test -race -short ./pkg/... ./internal/...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # go-fuse mounts via /bin/fusermount, which is the FUSE 2 binary in the
      # `fuse` package -- not fusermount3. Without it the end-to-end mount tests
      # skip, and mount would go untested where it can actually be tested.
      - name: Install FUSE (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fuse

      - name: Vet
        run: go vet ./...
      - name: AppleDouble unit tests and coverage above 95%
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-appledouble.go
      - name: AppleDouble 32-bit address-space regressions
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "0"
          GOARCH: "386"
        run: go test -count=1 ./pkg/appledouble
      - name: Upload AppleDouble evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appledouble-${{ matrix.os }}
          path: artifacts/appledouble/
          if-no-files-found: error
      - name: AppleDouble native pack and unpack comparisons
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-appledouble-native.go
      - name: Upload AppleDouble native evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: appledouble-native
          path: artifacts/appledouble-native/
          if-no-files-found: error
      - name: AppleDouble native ACL comparisons
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-appledouble-acl.go
      - name: Upload AppleDouble ACL evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: appledouble-acl
          path: artifacts/appledouble-acl/
          if-no-files-found: error
      - name: AppleDouble native quarantine comparisons
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-appledouble-quarantine.go
      - name: Upload AppleDouble quarantine evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: appledouble-quarantine
          path: artifacts/appledouble-quarantine/
          if-no-files-found: error
      - name: AppleDouble quarantine runtime context comparisons
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-appledouble-quarantine-runtime.go
      - name: Upload AppleDouble quarantine runtime evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: appledouble-quarantine-runtime
          path: artifacts/appledouble-quarantine-runtime/
          if-no-files-found: error
      - name: AppleDouble quarantine destination normalization
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-appledouble-quarantine-runtime.go -normalization
      - name: Upload AppleDouble quarantine normalization evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: appledouble-quarantine-normalization
          path: artifacts/appledouble-quarantine-runtime-normalization/
          if-no-files-found: error
      - name: AppleDouble quarantine process flag combinations
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-appledouble-quarantine-runtime.go -processes
      - name: Upload AppleDouble quarantine process evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: appledouble-quarantine-processes
          path: artifacts/appledouble-quarantine-runtime-processes/
          if-no-files-found: error
      - name: Strict xattr API tests and coverage above 95%
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-xattrs.go
      - name: Upload strict xattr API evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strict-xattrs-${{ matrix.os }}
          path: artifacts/strict-xattrs/
          if-no-files-found: error
      - name: Build apfsck (Linux; pinned version)
        if: runner.os == 'Linux'
        run: |
          # apfsck checks the containers pkg/apfswrite produces on Linux;
          # fsck_apfs does the same job on macOS. The apt package is stale
          # (Dec 2023), so build a pinned version from source and keep its
          # checks stable across runs.
          git clone --depth 1 --branch v0.2.1 https://github.com/linux-apfs/apfsprogs /tmp/apfsprogs
          make -C /tmp/apfsprogs/apfsck
          sudo cp /tmp/apfsprogs/apfsck/apfsck /usr/local/bin/
          apfsck --version || true
      - name: Unit tests
        env:
          CGO_ENABLED: "0"
        # Everything except the acceptance suite, which runs separately below.
        run: go test ./pkg/... ./internal/...
      - name: Name hash first-use race regression (Linux)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./pkg/apfs -run '^TestNameHashConcurrentFirstUse$'
      - name: Acceptance tests (committed fixtures)
        env:
          CGO_ENABLED: "0"
        run: go test -v ./acceptance/
      - name: Cache acceptance images
        id: dmg-cache
        uses: actions/cache@v6
        with:
          path: .acceptance-cache
          key: acceptance-firefox-150.0-zed-0.196.5
      - name: Download Firefox 150 acceptance image
        if: steps.dmg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .acceptance-cache
          curl -fsSL --retry 3 -o .acceptance-cache/Firefox.dmg \
            "https://ftp.mozilla.org/pub/firefox/releases/150.0/mac/en-GB/Firefox%20150.0.dmg"
      - name: Download Zed 0.196.5 acceptance image
        if: steps.dmg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .acceptance-cache
          curl -fsSL --retry 3 -o .acceptance-cache/Zed.dmg \
            "https://github.com/zed-industries/zed/releases/download/v0.196.5/Zed-aarch64.dmg"
      - name: Acceptance tests (Firefox 150 image, HFS+)
        env:
          CGO_ENABLED: "0"
          APFS_ACCEPTANCE_DMG: ${{ github.workspace }}/.acceptance-cache/Firefox.dmg
        shell: bash
        run: go test -v -run TestAcceptance ./acceptance/
      - name: Acceptance tests (Zed 0.196.5 image, APFS)
        env:
          CGO_ENABLED: "0"
          APFS_ACCEPTANCE_DMG: ${{ github.workspace }}/.acceptance-cache/Zed.dmg
          APFS_ACCEPTANCE_VOLNAME: Zed
          APFS_ACCEPTANCE_APP: Zed.app
          APFS_ACCEPTANCE_BUNDLE_ID: dev.zed.Zed
          APFS_ACCEPTANCE_BINARY: zed
        shell: bash
        run: go test -v -run TestAcceptance ./acceptance/
