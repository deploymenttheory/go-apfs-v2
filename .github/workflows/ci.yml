name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        env:
          CGO_ENABLED: "0"
        run: go test ./pkg/...
      - name: CLI acceptance tests (fixtures)
        env:
          CGO_ENABLED: "0"
        run: go test -v ./internal/cli/
      - name: Cache Firefox 150 acceptance image
        id: dmg-cache
        uses: actions/cache@v4
        with:
          path: .acceptance-cache
          key: firefox-150.0-dmg
      - name: Download Firefox 150 acceptance image
        if: steps.dmg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .acceptance-cache
          curl -fsSL --retry 3 -o .acceptance-cache/Firefox.dmg \
            "https://ftp.mozilla.org/pub/firefox/releases/150.0/mac/en-GB/Firefox%20150.0.dmg"
      - name: Acceptance tests (Firefox 150 image)
        env:
          CGO_ENABLED: "0"
          APFS_ACCEPTANCE_DMG: ${{ github.workspace }}/.acceptance-cache/Firefox.dmg
        shell: bash
        run: go test -v -run TestAcceptance ./internal/cli/
