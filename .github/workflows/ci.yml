      - name: Upload image BSD flags coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-flags-coverage-${{ matrix.os }}
          path: artifacts/image-flags-coverage/
          if-no-files-found: error
      - name: Image stat restoration and coverage above 95%
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-image-stat-coverage.go
      - name: Upload image stat restoration coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-stat-coverage-${{ matrix.os }}
          path: artifacts/image-stat-coverage/
          if-no-files-found: error
      - name: Portable xattr restoration and image bindings above 95% coverage
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-xattr-restore-coverage.go
      - name: Upload xattr restoration coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xattr-restore-coverage-${{ matrix.os }}
          path: artifacts/xattr-restore-coverage/
          if-no-files-found: error
      - name: Portable AppleDouble unpack lifecycle above 95% coverage
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-unpack-restore-coverage.go
      - name: Upload AppleDouble unpack coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unpack-restore-coverage-${{ matrix.os }}
          path: artifacts/unpack-restore-coverage/
          if-no-files-found: error
      - name: Portable copy pipeline ordering and coverage above 95%
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-copy-pipeline-coverage.go
      - name: Upload copy pipeline coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: copy-pipeline-coverage-${{ matrix.os }}
          path: artifacts/copy-pipeline-coverage/
          if-no-files-found: error
      - name: Portable ordered stat restoration and coverage above 95%
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-stat-copy-coverage.go
      - name: Upload ordered stat restoration coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stat-copy-coverage-${{ matrix.os }}
          path: artifacts/stat-copy-coverage/
          if-no-files-found: error
      - name: AppleDouble 32-bit address-space regressions
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "0"
          GOARCH: "386"
        run: go test -count=1 ./pkg/appledouble
      - name: Upload AppleDouble evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appledouble-${{ matrix.os }}
          path: artifacts/appledouble/
          if-no-files-found: error
      - name: AppleDouble native pack and unpack comparisons
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-appledouble-native.go
      - name: Upload AppleDouble native evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: appledouble-native
          path: artifacts/appledouble-native/
          if-no-files-found: error
      - name: AppleDouble native ACL comparisons
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-appledouble-acl.go
      - name: Upload AppleDouble ACL evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: appledouble-acl
          path: artifacts/appledouble-acl/
          if-no-files-found: error
      - name: AppleDouble native ACL inheritance and restoration
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-appledouble-acl-inherit.go
      - name: Upload AppleDouble ACL inheritance evidence
