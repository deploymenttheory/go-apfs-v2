        uses: actions/upload-artifact@v7
        with:
          name: appledouble-acl-inherit
          path: artifacts/appledouble-acl-inherit/
          if-no-files-found: error
      - name: AppleDouble ordinary ACL copy policy and filesystem comparisons
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-appledouble-acl-copy.go
      - name: Upload AppleDouble ACL copy evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: appledouble-acl-copy
          path: artifacts/appledouble-acl-copy/
          if-no-files-found: error
      - name: Ordinary security copy execution and native fallback comparisons
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-security-copy.go
      - name: Upload security copy execution evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: security-copy
          path: artifacts/security-copy/
          if-no-files-found: error
      - name: Security volume policy query order and live native comparisons
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-security-copy-volume.go
      - name: Upload security volume policy native evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: security-copy-volume
          path: artifacts/security-copy-volume/
          if-no-files-found: error
      - name: Native descriptor source acquisition and copy comparisons
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-security-source.go
      - name: Upload native source acquisition evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: security-source
          path: artifacts/security-source/
          if-no-files-found: error
      - name: Native xattr restoration callbacks and write comparisons
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-xattr-restore.go
      - name: Upload native xattr restoration evidence
        if: always() && runner.os == 'macOS'
