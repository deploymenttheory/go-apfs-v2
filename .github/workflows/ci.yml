name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A feature revision runs once through its PR; merged main keeps the full matrix.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci-reporting:
    uses: ./.github/workflows/ci-reporting.yml

  name-comparison:
    uses: ./.github/workflows/name-comparison.yml

  name-writer:
    uses: ./.github/workflows/name-writer.yml

  pathname-authorization:
    uses: ./.github/workflows/pathname-authorization.yml

  pathname-limits:
    uses: ./.github/workflows/pathname-limits.yml

  name-lookup:
    uses: ./.github/workflows/name-lookup.yml

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up shared CI reporting
        uses: ./.github/actions/setup-ci-runner
      - name: Build (MIT)
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          apfs-ci-runner --suite ci/build/step3 --timeout 60m -- go build ./...

      - name: Retain complete CI command diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: ci-observability-ci-build-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: artifacts/ci-observability/
          compression-level: 9
          if-no-files-found: error
  lint:
    name: Lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Platform-specific files (mount, host metadata) only lint under their
        # own GOOS.
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0
        env:
          GOOS: ${{ matrix.goos }}
        with:
          version: v2.14.0

      # Use the Go version selected above, not the version that built the linter.
      - name: Check gofmt
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi

  native-boundary:
    name: Native dependency boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up shared CI reporting
        uses: ./.github/actions/setup-ci-runner
      - name: Verify generated typed wrappers
        run: |
          apfs-ci-runner --suite ci/native-boundary/step3 --timeout 60m -- go run scripts/generate-darwin-wrappers.go -check
      - name: Audit all six CGO-disabled dependency graphs
        run: |
          apfs-ci-runner --suite ci/native-boundary/step4 --timeout 60m -- go run scripts/audit-native-bindings.go -check
      - name: Upload native boundary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: native-boundary
          path: artifacts/native-bindings/
          if-no-files-found: error

      - name: Retain complete CI command diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: ci-observability-ci-native-boundary-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: artifacts/ci-observability/
          compression-level: 9
          if-no-files-found: error
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1.1.0
        with:
          # The default "stable" overrides go-version-file.
          go-version-input: ""
          go-version-file: go.mod

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # -race needs cgo, which the other test jobs turn off. -short skips the
      # scale tests (tens of thousands of files, gigabyte images): they
      # exercise single-threaded code, and under the race detector's memory
      # overhead they exceed the runner.
      - name: Set up shared CI reporting
        uses: ./.github/actions/setup-ci-runner
      - name: Unit tests with -race
        env:
          CGO_ENABLED: "1"
        # The complete native codec replay exceeds Go's default ten-minute
        # package timeout under instrumentation on the Linux runner. Retain
        # every case and record individual test timings for stall diagnosis.
        shell: bash
        run: |
          mkdir -p artifacts/race
          apfs-ci-runner --suite ci/race/step3 --timeout 44m -- go test -race -short -timeout 30m -json ./pkg/... ./internal/... | tee artifacts/race/tests.json
      - name: Upload race results and timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: race-results
          path: artifacts/race/
          if-no-files-found: error

      - name: Retain complete CI command diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: ci-observability-ci-race-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: artifacts/ci-observability/
          compression-level: 9
          if-no-files-found: error
  test:
    name: Test (${{ matrix.os }})
    needs: name-comparison
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # go-fuse mounts via /bin/fusermount, which is the FUSE 2 binary in the
      # `fuse` package -- not fusermount3. Without it the end-to-end mount tests
      # skip, and mount would go untested where it can actually be tested.
      - name: Set up shared CI reporting
        uses: ./.github/actions/setup-ci-runner
      - name: Install FUSE (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fuse

      - name: Vet
        run: |
          apfs-ci-runner --suite ci/test/step4 --timeout 60m -- go vet ./...
      - name: Qualify shared reporting evidence for this host
        run: |
          apfs-ci-runner --suite ci/test/reporting --timeout 8m -- go run scripts/verify-ci-reporting.go
      - name: Upload shared reporting coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: ci-reporting-coverage-${{ matrix.os }}
          path: artifacts/ci-reporting-coverage/
          if-no-files-found: error
      - name: Explicit OS version profiles above 95% coverage
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step5 --timeout 60m -- go run scripts/verify-osversion.go
      - name: Upload OS version profile coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: osversion-coverage-${{ matrix.os }}
          path: artifacts/osversion-coverage/
          if-no-files-found: error
      - name: Replacement fallback coverage above 95%
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step7 --timeout 60m -- go run scripts/verify-replacement.go
      - name: Upload replacement fallback coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: replacement-coverage-${{ matrix.os }}
          path: artifacts/replacement-coverage/
          if-no-files-found: error
      - name: Native APFS and HFS+ replacement qualification
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step9 --timeout 60m -- go run scripts/verify-replacement-native.go
      - name: Upload native replacement qualification
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: replacement-native
          path: artifacts/replacement-native/
          if-no-files-found: error
      - name: Held metadata providers above 95% coverage
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step11 --timeout 60m -- go run scripts/verify-held-metadata.go
      - name: Upload held metadata coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: held-metadata-${{ matrix.os }}
          path: artifacts/held-metadata/
          if-no-files-found: error
      - name: Strict xattr API tests and coverage above 95%
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step13 --timeout 60m -- go run scripts/verify-xattrs.go
      - name: Upload strict xattr API evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: strict-xattrs-${{ matrix.os }}
          path: artifacts/strict-xattrs/
          if-no-files-found: error
      - name: Native held xattr writes and Clang comparisons
        if: runner.os == 'macOS'
        run: |
          apfs-ci-runner --suite ci/test/step15 --timeout 60m -- go run scripts/verify-xattr-write-native.go
      - name: Upload native held xattr write evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: held-xattr-write
          path: artifacts/held-xattr-write/
          if-no-files-found: error
      - name: Native held xattr listing and Clang comparisons
        if: runner.os == 'macOS'
        run: |
          apfs-ci-runner --suite ci/test/step17 --timeout 60m -- go run scripts/verify-xattr-list-native.go
      - name: Upload native held xattr listing evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7.0.1
        with:
          include-hidden-files: true
          name: held-xattr-list
          path: artifacts/held-xattr-list/
          if-no-files-found: error

      - name: AppleDouble unit tests and coverage above 95%
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step19 --timeout 60m -- go run scripts/verify-appledouble.go
      - name: Portable ACL restoration/HFS security flags and coverage above 95%
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step20 --timeout 60m -- go run scripts/verify-acl-restore.go
      - name: Upload ACL restoration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: acl-restore-${{ matrix.os }}
          path: artifacts/acl-restore/
          if-no-files-found: error
      - name: Portable APFS/HFS image security capture and coverage above 95%
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step22 --timeout 60m -- go run scripts/verify-image-security-coverage.go
      - name: Upload image security capture coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: image-security-coverage-${{ matrix.os }}
          path: artifacts/image-security-coverage/
          if-no-files-found: error
      - name: Portable APFS root metadata and coverage above 95%
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step24 --timeout 60m -- go run scripts/verify-root-security-coverage.go
      - name: Root writer legacy layout hashes
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step25 --timeout 60m -- go run scripts/verify-root-layout.go
      - name: Upload root layout hashes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: root-layout-${{ matrix.os }}
          path: artifacts/root-layout/
          if-no-files-found: error
      - name: Upload root metadata coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: root-security-coverage-${{ matrix.os }}
          path: artifacts/root-security-coverage/
          if-no-files-found: error
      - name: Portable image permissions and coverage above 95%
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step28 --timeout 60m -- go run scripts/verify-mode-security-coverage.go
      - name: Upload image permissions coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: mode-security-coverage-${{ matrix.os }}
          path: artifacts/mode-security-coverage/
          if-no-files-found: error
      - name: Portable image ACL restoration and coverage above 95%
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step30 --timeout 60m -- go run scripts/verify-image-acl-coverage.go
      - name: Upload image ACL restoration coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: image-acl-coverage-${{ matrix.os }}
          path: artifacts/image-acl-coverage/
          if-no-files-found: error
      - name: Portable image security copy and coverage above 95%
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step32 --timeout 60m -- go run scripts/verify-image-copy-coverage.go
      - name: Upload image security copy coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: image-copy-coverage-${{ matrix.os }}
          path: artifacts/image-copy-coverage/
          if-no-files-found: error
      - name: Portable security volume policy and coverage above 95%
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step34 --timeout 60m -- go run scripts/verify-security-volume-coverage.go
      - name: Upload security volume policy coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: security-volume-coverage-${{ matrix.os }}
          path: artifacts/security-volume-coverage/
          if-no-files-found: error
      - name: Portable source acquisition and coverage above 95%
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step36 --timeout 60m -- go run scripts/verify-security-source-coverage.go
      - name: Upload source acquisition coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: security-source-coverage-${{ matrix.os }}
          path: artifacts/security-source-coverage/
          if-no-files-found: error
      - name: Independent image timestamps and coverage above 95%
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step38 --timeout 60m -- go run scripts/verify-image-times-coverage.go
      - name: Upload image timestamp coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: image-times-coverage-${{ matrix.os }}
          path: artifacts/image-times-coverage/
          if-no-files-found: error
      - name: Image BSD flags and coverage above 95%
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step40 --timeout 60m -- go run scripts/verify-image-flags-coverage.go
      - name: Upload image BSD flags coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: image-flags-coverage-${{ matrix.os }}
          path: artifacts/image-flags-coverage/
          if-no-files-found: error
      - name: Image stat restoration and coverage above 95%
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step42 --timeout 60m -- go run scripts/verify-image-stat-coverage.go
      - name: Upload image stat restoration coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: image-stat-coverage-${{ matrix.os }}
          path: artifacts/image-stat-coverage/
          if-no-files-found: error
      - name: Portable xattr restoration and image bindings above 95% coverage
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step44 --timeout 60m -- go run scripts/verify-xattr-restore-coverage.go
      - name: Upload xattr restoration coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: xattr-restore-coverage-${{ matrix.os }}
          path: artifacts/xattr-restore-coverage/
          if-no-files-found: error
      - name: Portable AppleDouble unpack lifecycle above 95% coverage
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step46 --timeout 60m -- go run scripts/verify-unpack-restore-coverage.go
      - name: Upload AppleDouble unpack coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: unpack-restore-coverage-${{ matrix.os }}
          path: artifacts/unpack-restore-coverage/
          if-no-files-found: error
      - name: Portable copy pipeline ordering and coverage above 95%
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step48 --timeout 60m -- go run scripts/verify-copy-pipeline-coverage.go
      - name: Upload copy pipeline coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: copy-pipeline-coverage-${{ matrix.os }}
          path: artifacts/copy-pipeline-coverage/
          if-no-files-found: error
      - name: Portable ordered stat restoration and coverage above 95%
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step50 --timeout 60m -- go run scripts/verify-stat-copy-coverage.go
      - name: Upload ordered stat restoration coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: stat-copy-coverage-${{ matrix.os }}
          path: artifacts/stat-copy-coverage/
          if-no-files-found: error
      - name: Streaming AppleDouble and sequential restoration above 95% coverage
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step52 --timeout 60m -- go run scripts/verify-appledouble-stream.go
      - name: Upload streaming and sequential coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: appledouble-stream-${{ matrix.os }}
          path: artifacts/appledouble-stream/
          if-no-files-found: error
      - name: Native sequential unpack partial-mutation comparisons
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step54 --timeout 60m -- go run scripts/verify-unpack-sequential.go
      - name: Upload native sequential unpack evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: unpack-sequential
          path: artifacts/unpack-sequential/
          if-no-files-found: error
      - name: Production metadata carrier and host integration above 95% coverage
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step56 --timeout 60m -- go run scripts/verify-metadata-transport-coverage.go
      - name: Upload production metadata transport coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: metadata-transport-coverage-${{ matrix.os }}
          path: artifacts/metadata-transport-coverage/
          if-no-files-found: error
      - name: Complete path lifecycle above 95% per-file coverage
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step58 --timeout 60m -- go run scripts/verify-path-lifecycle-coverage.go
      - name: Upload complete path lifecycle coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: path-lifecycle-coverage-${{ matrix.os }}
          path: artifacts/path-lifecycle-coverage/
          if-no-files-found: error
      - name: Pinned Apple path lifecycle and both SDK ASTs
        if: "!cancelled() && runner.os == 'macOS'"
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step60 --timeout 60m -- go run scripts/verify-path-lifecycle-source.go
      - name: Upload path-lifecycle-source evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: path-lifecycle-source
          path: artifacts/path-lifecycle-source/
          if-no-files-found: error
      - name: Native path creation, callback, cleanup and state release
        if: "!cancelled() && runner.os == 'macOS'"
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step62 --timeout 60m -- go run scripts/verify-path-copyfile-native.go
      - name: Upload path-copyfile-native evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: path-copyfile-native
          path: artifacts/path-copyfile-native/
          if-no-files-found: error
      - name: Native path ACL preparation and restoration
        if: "!cancelled() && runner.os == 'macOS'"
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step64 --timeout 60m -- go run scripts/verify-path-security-native.go
      - name: Upload path-security-native evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: path-security-native
          path: artifacts/path-security-native/
          if-no-files-found: error
      - name: Native attribute mutation provider contexts and portable replay
        if: "!cancelled() && runner.os == 'macOS'"
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step66 --timeout 60m -- go run scripts/verify-xattr-remove-effects-native.go
      - name: Upload xattr-remove-effects-native evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: xattr-remove-effects-native
          path: artifacts/xattr-remove-effects-native/
          if-no-files-found: error
      - name: Native held AppleDouble object byte and metadata parity
        if: "!cancelled() && runner.os == 'macOS'"
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step68 --timeout 60m -- go run scripts/verify-appledouble-object-native.go
      - name: Upload appledouble-object-native evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: appledouble-object-native
          path: artifacts/appledouble-object-native/
          if-no-files-found: error
      - name: Privileged and nonowner held-object authorization
        if: "!cancelled() && runner.os == 'macOS'"
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step70 --timeout 60m -- go run scripts/verify-appledouble-object-authorization.go
      - name: Upload appledouble-object-authorization evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: appledouble-object-authorization
          path: artifacts/appledouble-object-authorization/
          if-no-files-found: error
      - name: Native and signed sandbox attribute-intent policy
        if: "!cancelled() && runner.os == 'macOS'"
        env:
