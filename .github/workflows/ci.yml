          include-hidden-files: true
          name: appledouble-quarantine-normalization
          path: artifacts/appledouble-quarantine-runtime-normalization/
          if-no-files-found: error
      - name: AppleDouble quarantine process flag combinations
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step157 --timeout 60m -- go run scripts/verify-appledouble-quarantine-runtime.go -processes
      - name: Upload AppleDouble quarantine process evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: appledouble-quarantine-processes
          path: artifacts/appledouble-quarantine-runtime-processes/
          if-no-files-found: error
      - name: AppleDouble raw and malformed destination quarantine
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step159 --timeout 60m -- go run scripts/verify-appledouble-quarantine-runtime.go -existing
      - name: Upload AppleDouble existing quarantine evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: appledouble-quarantine-existing
          path: artifacts/appledouble-quarantine-runtime-existing/
          if-no-files-found: error
      - name: AppleDouble raw process capture and absent contexts
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step161 --timeout 60m -- go run scripts/verify-appledouble-quarantine-runtime.go -contexts
      - name: Upload AppleDouble raw context evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: appledouble-quarantine-contexts
          path: artifacts/appledouble-quarantine-runtime-contexts/
          if-no-files-found: error
      - name: AppleDouble quarantine destination kinds and link targets
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step163 --timeout 60m -- go run scripts/verify-appledouble-quarantine-runtime.go -destinations
      - name: Upload AppleDouble quarantine destination evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: appledouble-quarantine-destinations
          path: artifacts/appledouble-quarantine-runtime-destinations/
          if-no-files-found: error
      - name: Build apfsck (Linux; pinned version)
        if: runner.os == 'Linux'
        run: |
          # apfsck checks the containers pkg/apfswrite produces on Linux;
          # fsck_apfs does the same job on macOS. The apt package is stale
          # (Dec 2023), so build a pinned version from source and keep its
          # checks stable across runs.
          git clone --depth 1 --branch v0.2.1 https://github.com/linux-apfs/apfsprogs /tmp/apfsprogs
          make -C /tmp/apfsprogs/apfsck
          sudo cp /tmp/apfsprogs/apfsck/apfsck /usr/local/bin/
          apfsck --version || true
      - name: Unit tests
        env:
          CGO_ENABLED: "0"
        # Everything except the acceptance suite, which runs separately below.
        run: |
          apfs-ci-runner --suite ci/test/step166 --timeout 60m -- go test -json ./pkg/... ./internal/...
      - name: Name hash first-use race regression (Linux)
        if: runner.os == 'Linux'
        run: |
          apfs-ci-runner --suite ci/test/step167 --timeout 60m -- go test -json -race -count=1 ./pkg/apfs -run '^TestNameHashConcurrentFirstUse$'
      - name: Acceptance tests (committed fixtures)
        env:
          CGO_ENABLED: "0"
        run: |
          apfs-ci-runner --suite ci/test/step168 --timeout 60m -- go test -json -v ./acceptance/
      - name: Cache acceptance images
        id: dmg-cache
        uses: actions/cache@v6
        with:
          path: .acceptance-cache
          key: acceptance-firefox-150.0-zed-0.196.5-charles-5.2.1-bbedit-16.0.3
      - name: Download Firefox 150 acceptance image
        if: steps.dmg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .acceptance-cache
          curl -fsSL --retry 3 -o .acceptance-cache/Firefox.dmg \
            "https://ftp.mozilla.org/pub/firefox/releases/150.0/mac/en-GB/Firefox%20150.0.dmg"
      - name: Download Zed 0.196.5 acceptance image
        if: steps.dmg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .acceptance-cache
          curl -fsSL --retry 3 -o .acceptance-cache/Zed.dmg \
            "https://github.com/zed-industries/zed/releases/download/v0.196.5/Zed-aarch64.dmg"
      - name: Acceptance tests (Firefox 150 image, HFS+)
        env:
          CGO_ENABLED: "0"
          APFS_ACCEPTANCE_DMG: ${{ github.workspace }}/.acceptance-cache/Firefox.dmg
          APFS_ACCEPTANCE_FILESYSTEM: hfs+
        shell: bash
        run: |
          apfs-ci-runner --suite ci/test/step172 --timeout 60m -- go test -json -v -run TestAcceptance ./acceptance/
      - name: Acceptance tests (Zed 0.196.5 image, APFS)
        env:
          CGO_ENABLED: "0"
          APFS_ACCEPTANCE_DMG: ${{ github.workspace }}/.acceptance-cache/Zed.dmg
          APFS_ACCEPTANCE_VOLNAME: Zed
          APFS_ACCEPTANCE_APP: Zed.app
          APFS_ACCEPTANCE_BUNDLE_ID: dev.zed.Zed
          APFS_ACCEPTANCE_BINARY: zed
          APFS_ACCEPTANCE_FILESYSTEM: apfs
        shell: bash
        run: |
          apfs-ci-runner --suite ci/test/step173 --timeout 60m -- go test -json -v -run TestAcceptance ./acceptance/
      - name: Download Charles 5.2.1 and BBEdit 16.0.3 acceptance images
        if: steps.dmg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL --retry 3 --connect-timeout 30 --max-time 600 -o .acceptance-cache/Charles.dmg \
            "https://www.charlesproxy.com/assets/release/5.2.1/charles-proxy-5.2.1.dmg"
          curl -fsSL --retry 3 --connect-timeout 30 --max-time 600 -o .acceptance-cache/BBEdit.dmg \
            "https://s3.amazonaws.com/BBSW-download/BBEdit_16.0.3.dmg"
      - name: Acceptance tests (Charles 5.2.1 image, HFS+)
        env:
          CGO_ENABLED: "0"
          APFS_ACCEPTANCE_DMG: ${{ github.workspace }}/.acceptance-cache/Charles.dmg
          APFS_ACCEPTANCE_VOLNAME: Charles Proxy v5.2.1
          APFS_ACCEPTANCE_APP: Charles.app
          APFS_ACCEPTANCE_BUNDLE_ID: com.xk72.Charles
          APFS_ACCEPTANCE_BINARY: Charles
          APFS_ACCEPTANCE_FILESYSTEM: hfs+
          APFS_ACCEPTANCE_SHA256: d233395a7fbb487f0fe20ddff16e02a65990add20d5aa9ce1e87a8f9ff0fe0d5
        shell: bash
        run: |
          mkdir -p artifacts/vendor-dmg
          apfs-ci-runner --suite ci/test/step175 --timeout 60m -- go test -json -count=1 -run TestAcceptance ./acceptance/ | tee artifacts/vendor-dmg/charles.jsonl
      - name: Acceptance tests (BBEdit 16.0.3 image, APFS)
        env:
          CGO_ENABLED: "0"
          APFS_ACCEPTANCE_DMG: ${{ github.workspace }}/.acceptance-cache/BBEdit.dmg
          APFS_ACCEPTANCE_VOLNAME: BBEdit 16.0.3
          APFS_ACCEPTANCE_APP: BBEdit.app
          APFS_ACCEPTANCE_BUNDLE_ID: com.barebones.bbedit
          APFS_ACCEPTANCE_BINARY: BBEdit
          APFS_ACCEPTANCE_FILESYSTEM: apfs
          APFS_ACCEPTANCE_SHA256: acf2ae9e5c68beacdfd7534861fa8c992e1bdd5391a71b3c08b3ed879c2b3572
        shell: bash
        run: |
          mkdir -p artifacts/vendor-dmg
          apfs-ci-runner --suite ci/test/step176 --timeout 60m -- go test -json -count=1 -run TestAcceptance ./acceptance/ | tee artifacts/vendor-dmg/bbedit.jsonl
      - name: Upload commercial DMG acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: vendor-dmg-${{ matrix.os }}
          path: artifacts/vendor-dmg/
          if-no-files-found: error

      - name: Retain complete CI command diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: ci-observability-ci-test-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: artifacts/ci-observability/
          compression-level: 9
          if-no-files-found: error
