      - name: Native AppleDouble unpack ordering and live writes
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-unpack-restore.go
      - name: Upload native AppleDouble unpack evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: unpack-restore
          path: artifacts/unpack-restore/
          if-no-files-found: error
      - name: Native copy pipeline ordering comparisons
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-copy-pipeline.go
      - name: Upload native copy pipeline evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: copy-pipeline
          path: artifacts/copy-pipeline/
          if-no-files-found: error
      - name: Native ordered stat restoration comparisons
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-stat-copy.go
      - name: Upload native stat restoration evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: stat-copy
          path: artifacts/stat-copy/
          if-no-files-found: error
      - name: Native APFS/HFS image security capture comparisons
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-image-security.go
      - name: Upload native image security capture evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: image-security
          path: artifacts/image-security/
          if-no-files-found: error
      - name: Native APFS root metadata and fsck qualification
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-image-security.go -roots
      - name: Upload native root metadata evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: image-root-security
          path: artifacts/image-root-security/
          if-no-files-found: error
      - name: Native APFS/HFS image permissions and fsck qualification
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-image-security.go -modes
      - name: Upload native image permissions evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: image-mode-security
          path: artifacts/image-mode-security/
          if-no-files-found: error
      - name: Native image timestamp and filesystem qualification
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-image-security.go -times
      - name: Upload native image timestamp evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: image-times
          path: artifacts/image-times/
          if-no-files-found: error
      - name: Native image BSD flags and filesystem qualification
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-image-security.go -flags
      - name: Upload native image BSD flags evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: image-flags
          path: artifacts/image-flags/
          if-no-files-found: error
      - name: Native image stat restoration and filesystem qualification
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-image-security.go -stat
      - name: Upload native image stat restoration evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: image-stat
          path: artifacts/image-stat/
          if-no-files-found: error
      - name: Native image ACL restoration and filesystem qualification
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-image-acl-restore.go
      - name: Upload native image ACL restoration evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: image-acl-restore
          path: artifacts/image-acl-restore/
          if-no-files-found: error
      - name: Native image security copy and filesystem qualification
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-image-security-copy.go
      - name: Upload native image security copy evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: image-security-copy
          path: artifacts/image-security-copy/
          if-no-files-found: error
      - name: AppleDouble native security records and ACL application
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-appledouble-filesec.go
      - name: Upload AppleDouble security record evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: appledouble-filesec
          path: artifacts/appledouble-filesec/
          if-no-files-found: error
      - name: AppleDouble native quarantine comparisons
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-appledouble-quarantine.go
      - name: Upload AppleDouble quarantine evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: appledouble-quarantine
          path: artifacts/appledouble-quarantine/
          if-no-files-found: error
      - name: AppleDouble quarantine runtime context comparisons
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-appledouble-quarantine-runtime.go
      - name: Upload AppleDouble quarantine runtime evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: appledouble-quarantine-runtime
          path: artifacts/appledouble-quarantine-runtime/
          if-no-files-found: error
      - name: AppleDouble quarantine destination normalization
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-appledouble-quarantine-runtime.go -normalization
      - name: Upload AppleDouble quarantine normalization evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: appledouble-quarantine-normalization
          path: artifacts/appledouble-quarantine-runtime-normalization/
          if-no-files-found: error
      - name: AppleDouble quarantine process flag combinations
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-appledouble-quarantine-runtime.go -processes
      - name: Upload AppleDouble quarantine process evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: appledouble-quarantine-processes
          path: artifacts/appledouble-quarantine-runtime-processes/
          if-no-files-found: error
      - name: AppleDouble raw and malformed destination quarantine
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-appledouble-quarantine-runtime.go -existing
      - name: Upload AppleDouble existing quarantine evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: appledouble-quarantine-existing
          path: artifacts/appledouble-quarantine-runtime-existing/
          if-no-files-found: error
      - name: AppleDouble raw process capture and absent contexts
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-appledouble-quarantine-runtime.go -contexts
      - name: Upload AppleDouble raw context evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: appledouble-quarantine-contexts
          path: artifacts/appledouble-quarantine-runtime-contexts/
          if-no-files-found: error
      - name: AppleDouble quarantine destination kinds and link targets
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "0"
        run: go run scripts/verify-appledouble-quarantine-runtime.go -destinations
      - name: Upload AppleDouble quarantine destination evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: appledouble-quarantine-destinations
          path: artifacts/appledouble-quarantine-runtime-destinations/
          if-no-files-found: error
      - name: Build apfsck (Linux; pinned version)
        if: runner.os == 'Linux'
        run: |
          # apfsck checks the containers pkg/apfswrite produces on Linux;
          # fsck_apfs does the same job on macOS. The apt package is stale
          # (Dec 2023), so build a pinned version from source and keep its
          # checks stable across runs.
          git clone --depth 1 --branch v0.2.1 https://github.com/linux-apfs/apfsprogs /tmp/apfsprogs
          make -C /tmp/apfsprogs/apfsck
          sudo cp /tmp/apfsprogs/apfsck/apfsck /usr/local/bin/
          apfsck --version || true
      - name: Unit tests
        env:
          CGO_ENABLED: "0"
        # Everything except the acceptance suite, which runs separately below.
        run: go test ./pkg/... ./internal/...
      - name: Name hash first-use race regression (Linux)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./pkg/apfs -run '^TestNameHashConcurrentFirstUse$'
      - name: Acceptance tests (committed fixtures)
        env:
          CGO_ENABLED: "0"
        run: go test -v ./acceptance/
      - name: Cache acceptance images
        id: dmg-cache
        uses: actions/cache@v6
        with:
          path: .acceptance-cache
          key: acceptance-firefox-150.0-zed-0.196.5-charles-5.2.1-bbedit-16.0.3
      - name: Download Firefox 150 acceptance image
        if: steps.dmg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .acceptance-cache
          curl -fsSL --retry 3 -o .acceptance-cache/Firefox.dmg \
            "https://ftp.mozilla.org/pub/firefox/releases/150.0/mac/en-GB/Firefox%20150.0.dmg"
      - name: Download Zed 0.196.5 acceptance image
