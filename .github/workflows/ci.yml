name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build (default, MIT)
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...
      - name: Build (GPL, -tags apfswrite)
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -tags apfswrite ./...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Build apfsck oracle (Linux; pinned to the ported mkapfs version)
        if: runner.os == 'Linux'
        run: |
          # The apt apfsprogs is stale (Dec 2023) and its checks disagree with
          # the mkapfs v0.2.1 that pkg/apfswrite was ported from. Build the
          # matching apfsck from source so the oracle is version-consistent.
          git clone --depth 1 --branch v0.2.1 https://github.com/linux-apfs/apfsprogs /tmp/apfsprogs
          make -C /tmp/apfsprogs/apfsck
          sudo cp /tmp/apfsprogs/apfsck/apfsck /usr/local/bin/
          apfsck --version || true
      - name: Unit tests
        env:
          CGO_ENABLED: "0"
        run: go test ./pkg/...
      - name: CLI acceptance tests (fixtures)
        env:
          CGO_ENABLED: "0"
        run: go test -v ./internal/cli/
      - name: Cache acceptance images
        id: dmg-cache
        uses: actions/cache@v4
        with:
          path: .acceptance-cache
          key: acceptance-firefox-150.0-zed-0.196.5
      - name: Download Firefox 150 acceptance image
        if: steps.dmg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .acceptance-cache
          curl -fsSL --retry 3 -o .acceptance-cache/Firefox.dmg \
            "https://ftp.mozilla.org/pub/firefox/releases/150.0/mac/en-GB/Firefox%20150.0.dmg"
      - name: Download Zed 0.196.5 acceptance image
        if: steps.dmg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .acceptance-cache
          curl -fsSL --retry 3 -o .acceptance-cache/Zed.dmg \
            "https://github.com/zed-industries/zed/releases/download/v0.196.5/Zed-aarch64.dmg"
      - name: Acceptance tests (Firefox 150 image, HFS+)
        env:
          CGO_ENABLED: "0"
          APFS_ACCEPTANCE_DMG: ${{ github.workspace }}/.acceptance-cache/Firefox.dmg
        shell: bash
        run: go test -v -run TestAcceptance ./internal/cli/
      - name: Acceptance tests (Zed 0.196.5 image, APFS)
        env:
          CGO_ENABLED: "0"
          APFS_ACCEPTANCE_DMG: ${{ github.workspace }}/.acceptance-cache/Zed.dmg
          APFS_ACCEPTANCE_VOLNAME: Zed
          APFS_ACCEPTANCE_APP: Zed.app
          APFS_ACCEPTANCE_BUNDLE_ID: dev.zed.Zed
          APFS_ACCEPTANCE_BINARY: zed
        shell: bash
        run: go test -v -run TestAcceptance ./internal/cli/
