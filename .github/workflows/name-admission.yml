name: Native filename admission
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: name-admission-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local
jobs:
  native:
    name: Native filename admission (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest, xcode-27]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up shared CI reporting
        uses: ./.github/actions/setup-ci-runner
      - name: Reject incomplete or changed scalar admission evidence
        run: |
          apfs-ci-runner --suite name-admission/native/step3 --timeout 39m -- go test -json scripts/capture-name-admission.go scripts/capture-name-admission_test.go
      - name: Capture every scalar through actual APFS and APFSX creation
        run: |
          apfs-ci-runner --suite name-admission/native/step4 --timeout 39m -- go run scripts/capture-name-admission.go -out artifacts/name-admission -check
      - name: Retain source provenance ASTs actual errno arrays and native images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: name-admission-${{ matrix.os }}
          path: artifacts/name-admission/
          compression-level: 9
          if-no-files-found: error

      - name: Retain complete CI command diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-observability-name-admission-native-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: artifacts/ci-observability/
          compression-level: 9
          if-no-files-found: error
