      - name: Upload durable syscall checkpoint before-01-root-open
        if: always() && inputs.continuous != true
        uses: actions/upload-artifact@v7
        with:
          name: syscall-before-01-root-open
          path: |
            artifacts/name-native-diagnostic/syscall-control/
            artifacts/name-native-diagnostic/syscall-process.*
            artifacts/name-native-diagnostic/syscall-step-*.jsonl
            artifacts/name-native-diagnostic/syscall-plan.json
