name: Carrier recompression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: carrier-recompression-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local

jobs:
  portable:
    name: Carrier recompression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, artifact: linux }
          - { os: windows-latest, artifact: windows }
          - { os: macos-latest, artifact: darwin }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Qualify every native profile and complete carrier coverage above 95 percent
        run: go run scripts/verify-carrier-recompression.go
      - name: Retain images, exact expected bytes and complete coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: carrier-recompression-${{ matrix.artifact }}
          path: artifacts/carrier-recompression-portable/
          if-no-files-found: error

  native:
    name: Native carrier readback (${{ matrix.os }})
    needs: portable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest, xcode-27]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: carrier-recompression-*
          path: artifacts/carrier-recompression-foreign
      - name: Independently mount and read all three producers with Clang and the native kernel
        shell: bash
        run: |
          set -euo pipefail
          for producer in linux windows darwin; do
            go run scripts/verify-carrier-recompression-native.go -foreign "artifacts/carrier-recompression-foreign/carrier-recompression-${producer}"
          done
      - name: Retain both ASTs, full native bytes, metadata and disk-image cleanup evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: carrier-recompression-native-${{ matrix.os }}
          path: artifacts/carrier-recompression-foreign/**/native-readback/
          if-no-files-found: error

  access:
    name: Native recompression authority (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest, xcode-27]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Rebuild both architecture ASTs and recapture all 168 access and two compressed-open cases
        run: go run scripts/capture-recompression-access.go -out artifacts/recompression-access/native.json.gz -check
      - name: Independently replay fresh native authority evidence against the portable implementation
        if: always()
        shell: bash
        env:
          APFS_RECOMPRESSION_ACCESS_CAPTURE: ${{ github.workspace }}/artifacts/recompression-access/native.json.gz
        run: |
          set -euo pipefail
          mkdir -p artifacts/recompression-access
          go test -count=1 -json ./pkg/recompression -run '^(TestRecompressionAccess(NativeEvidence|SourceEvidence)|TestRecompressionObjectNativeAcquisition)$' > artifacts/recompression-access/replay.jsonl
      - name: Retain every native case, Clang AST and portable replay result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recompression-access-${{ matrix.os }}
          path: artifacts/recompression-access/
          if-no-files-found: error
