name: Supplemental complete raw native image observations
on:
  workflow_call:
    inputs:
      producer_run:
        type: string
        required: true
      case_id:
        type: string
        default: ""
      profile:
        type: string
        default: "26"
      filesystem:
        type: string
        default: APFS
permissions:
  contents: read
  actions: read
concurrency:
  group: name-raw-diagnostic-${{ github.ref }}-${{ inputs.profile }}-${{ inputs.filesystem }}-${{ inputs.case_id || 'all' }}
  cancel-in-progress: false
env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local
jobs:
  boundary:
    name: Raw image observations (${{ inputs.profile }}, ${{ inputs.filesystem }}, ${{ inputs.case_id || 'all' }})
    runs-on: macos-15
    timeout-minutes: 10
    env:
      APFS_NAME_DIAGNOSTIC_PROFILE: ${{ inputs.profile }}
      APFS_NAME_DIAGNOSTIC_FILESYSTEM: ${{ inputs.filesystem }}
      APFS_NAME_DIAGNOSTIC_RUN: ${{ inputs.producer_run }}
      APFS_NAME_DIAGNOSTIC_CASE: ${{ inputs.case_id }}
      APFS_NAME_DIAGNOSTIC_HOST: "15"
      APFS_NAME_IMAGE_ARTIFACTS: ${{ github.workspace }}/artifacts/native-images
      APFS_NAME_DIAGNOSTIC_RUN_MANIFEST: ${{ github.workspace }}/artifacts/name-native-diagnostic/source-run.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Record completed producer identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$APFS_NAME_DIAGNOSTIC_RUN" =~ ^[0-9]+$ ]]
          mkdir -p artifacts/name-native-diagnostic
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APFS_NAME_DIAGNOSTIC_RUN" > "$APFS_NAME_DIAGNOSTIC_RUN_MANIFEST"
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.producer_run }}
          pattern: name-collation-*
          path: artifacts/native-images
      - name: Build and validate exact command-boundary checkpoint
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          go test -c -o "$GITHUB_WORKSPACE/artifacts/name-native-diagnostic/boundary.test" scripts/capture-name-collation.go scripts/verify-name-comparison_test.go scripts/verify-name-native_readback_test.go scripts/verify-name-native_commands_test.go scripts/verify-name-native_diagnostic_test.go scripts/verify-name-native_boundary_test.go scripts/verify-name-native_syscall_test.go scripts/verify-name-native_raw_test.go 2>&1 | tee artifacts/name-native-diagnostic/build.log
          cd scripts
          go tool test2json -t -p command-line-arguments "$GITHUB_WORKSPACE/artifacts/name-native-diagnostic/boundary.test" -test.v=test2json -test.timeout=3m -test.run='^(TestSingleNameDiagnostic.*|TestSingleNameRawTraceValidation|TestPrepareNativeSingleNameImageDiagnostic|TestPrepareNativeRawTrace)$' | tee "$GITHUB_WORKSPACE/artifacts/name-native-diagnostic/prepare-tests.jsonl"
      - name: Upload durable checkpoint before identity
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raw-boundary-before-identity
          path: artifacts/name-native-diagnostic/
          compression-level: 9
          if-no-files-found: error
      - name: Native boundary identity
        timeout-minutes: 1
        shell: bash
        working-directory: scripts
        run: |
          set -euo pipefail
          go tool test2json -t -p command-line-arguments "$GITHUB_WORKSPACE/artifacts/name-native-diagnostic/boundary.test" -test.v=test2json -test.timeout=1m -test.run='^TestNativeNameBoundaryIdentity$' | tee "$GITHUB_WORKSPACE/artifacts/name-native-diagnostic/boundary-identity-tests.jsonl"
      - name: Upload durable checkpoint before attach
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raw-boundary-before-attach
          path: artifacts/name-native-diagnostic/
          compression-level: 9
          if-no-files-found: error
      - name: Native boundary attach
        timeout-minutes: 1
        shell: bash
        working-directory: scripts
        run: |
          set -euo pipefail
          go tool test2json -t -p command-line-arguments "$GITHUB_WORKSPACE/artifacts/name-native-diagnostic/boundary.test" -test.v=test2json -test.timeout=1m -test.run='^TestNativeNameBoundaryAttach$' | tee "$GITHUB_WORKSPACE/artifacts/name-native-diagnostic/boundary-attach-tests.jsonl"
      - name: Upload durable checkpoint before readback
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raw-boundary-before-readback
          path: artifacts/name-native-diagnostic/
          compression-level: 9
          if-no-files-found: error
      - name: Native boundary readback
        timeout-minutes: 3
        shell: bash
        working-directory: scripts
        run: |
          set -euo pipefail
          go tool test2json -t -p command-line-arguments "$GITHUB_WORKSPACE/artifacts/name-native-diagnostic/boundary.test" -test.v=test2json -test.timeout=3m -test.run='^TestNativeRawTraceCapture$' | tee "$GITHUB_WORKSPACE/artifacts/name-native-diagnostic/boundary-readback-tests.jsonl"
      - name: Preserve bounded native filesystem log
        if: always()
        timeout-minutes: 1
        shell: bash
        working-directory: scripts
        run: |
          set -euo pipefail
          go tool test2json -t -p command-line-arguments "$GITHUB_WORKSPACE/artifacts/name-native-diagnostic/boundary.test" -test.v=test2json -test.timeout=1m -test.run='^TestNativeSyscallTraceHostLog$' | tee "$GITHUB_WORKSPACE/artifacts/name-native-diagnostic/raw-host-log-tests.jsonl"
      - name: Stop owned native process and close descriptors
        if: always()
        timeout-minutes: 1
        shell: bash
        working-directory: scripts
        run: |
          set -euo pipefail
          go tool test2json -t -p command-line-arguments "$GITHUB_WORKSPACE/artifacts/name-native-diagnostic/boundary.test" -test.v=test2json -test.timeout=1m -test.run='^TestNativeSyscallTraceStop$' | tee "$GITHUB_WORKSPACE/artifacts/name-native-diagnostic/raw-stop-tests.jsonl"
      - name: Upload durable checkpoint before detach
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raw-boundary-before-detach
          path: artifacts/name-native-diagnostic/
          compression-level: 9
          if-no-files-found: error
      - name: Native boundary detach
        if: always()
        timeout-minutes: 1
        shell: bash
        working-directory: scripts
        run: |
          set -euo pipefail
          go tool test2json -t -p command-line-arguments "$GITHUB_WORKSPACE/artifacts/name-native-diagnostic/boundary.test" -test.v=test2json -test.timeout=1m -test.run='^TestNativeNameBoundaryDetach$' | tee "$GITHUB_WORKSPACE/artifacts/name-native-diagnostic/boundary-detach-tests.jsonl"
      - name: Preserve final boundary outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raw-boundary-outcome
          path: artifacts/name-native-diagnostic/
          compression-level: 9
          if-no-files-found: error
      - name: Compare preserved raw observations after detach
        if: always()
        timeout-minutes: 1
        shell: bash
        working-directory: scripts
        run: |
          set -euo pipefail
          go tool test2json -t -p command-line-arguments "$GITHUB_WORKSPACE/artifacts/name-native-diagnostic/boundary.test" -test.v=test2json -test.timeout=1m -test.run='^TestNativeRawTraceCompare$'
